[project]
name = "lora-factory"
version = "0.2.0"
description = "Агентная система автоматического дообучения LLM-адаптеров (LoRA / QLoRA / P-tuning) под NLP-задачи"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "torch==2.9.1",  # колёса PyPI: CUDA 12.8; нужен для unsloth_zoo (torchao>=0.13)
    "torchao==0.16.0",
    "unsloth==2026.10.7",
    "unsloth-zoo==2026.10.7",
    "async-lru>=2.3.0",
    "asyncio>=4.0.0",
    "openai>=2.30.0",
    "peft==0.21.*",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.6.0",
    "bert-score>=0.3.13",
    "fasttext-wheel>=0.9.2",
    "pydantic-ai-slim[openai]==2.56.*",
    "transformers==5.17.*",
    "trl==1.15.*",
    "datasets>=4.0",
    "huggingface-hub>=1.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "sentence-transformers==6.1.*",
    "rank-bm25>=0.2.2",
    "cleanlab>=2.7",
    "datasketch>=1.6",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "psutil>=5.9",
    "pyarrow>=17",
    "pyyaml>=6",
    "fastapi==0.143.*",
    "uvicorn>=0.30",
    "mlflow==3.17.*",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

# Windows: на PyPI torch только CPU-сборка — берём CUDA 12.8 с индекса PyTorch (Linux остаётся на PyPI)
[tool.uv]
constraint-dependencies = ["triton-windows<3.6 ; sys_platform == 'win32'"]  # 3.5.x — пара для torch 2.9

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: обучение крошечной модели в отдельном процессе (медленно)"]
