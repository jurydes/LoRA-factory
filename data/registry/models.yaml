# Реестр базовых моделей. LLM выбирает только из отфильтрованного кодом списка (ограничения постановки + железо);
# имена LoRA-модулей берутся отсюда, а не от LLM.
# vocab_size — для оценки памяти логитов; kv_bytes_per_token — KV-кэш генерации на токен (bf16, слои с кэшем:
# у Qwen3.5 линейное внимание кэша не держит); gated — нужен HF_TOKEN с принятой лицензией;
# unsloth — архитектура поддерживается Unsloth; chat_template — промпт строится шаблоном чата;
# quality — MMLU-Pro без режима рассуждений по карточкам моделей (~ — оценка по соседним размерам и бенчмаркам):
# рекомендуется лучшая по нему модель из помещающихся в память и время; text_only — чекпоинт мультимодальный,
# обучается только языковая часть.

